<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Italy Trip — June 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --terra: #b85c38; --terra-mid: #d4744f;
    --stone: #f5f0eb; --ink: #2a2218;
    --ink-mid: #5a5040; --ink-light: #9a8f80;
    --white: #fdfaf7; --card-bg: #ffffff;
    --shadow: 0 2px 16px rgba(42,34,24,0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--stone); color: var(--ink); min-height: 100vh; padding-bottom: 40px; }

  /* HERO */
  .hero { background: var(--ink); padding: 48px 24px 36px; text-align: center; position: relative; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background-image: url('https://images.unsplash.com/photo-1523531294919-4bcd7c65e216?w=1200&q=85&fit=crop&crop=center'); background-size: cover; background-position: center 35%; opacity: 0.48; }
  .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(30,20,10,0.45) 0%, rgba(42,28,14,0.78) 100%), radial-gradient(ellipse at 70% 20%, rgba(184,92,56,0.30) 0%, transparent 60%); pointer-events: none; z-index: 1; }
  .hero-label { font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--terra-mid); margin-bottom: 12px; position: relative; z-index: 2; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 600; color: #fdfaf7; line-height: 1.2; margin-bottom: 8px; position: relative; z-index: 2; }
  .hero-sub { font-size: 13px; color: rgba(253,250,247,0.65); font-weight: 300; line-height: 1.6; position: relative; z-index: 2; }
  .hero-badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; position: relative; z-index: 2; }
  .hero-badge { font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(253,250,247,0.2); color: rgba(253,250,247,0.7); background: rgba(253,250,247,0.07); }

  /* TABS BAR */
  .tabs-wrap { position: sticky; top: 0; z-index: 100; background: var(--ink); padding: 10px 12px 14px; border-bottom: 1px solid rgba(253,250,247,0.08); display: flex; align-items: center; gap: 8px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; flex: 1; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 20px; border: 1.5px solid rgba(253,250,247,0.2); background: transparent; color: rgba(253,250,247,0.55); cursor: pointer; transition: all .2s; white-space: nowrap; }
  .tab.active { background: var(--terra); border-color: var(--terra); color: #fff; }

  /* LANGUAGE TOGGLE */
  .lang-toggle { flex-shrink: 0; display: flex; border-radius: 20px; border: 1.5px solid rgba(253,250,247,0.2); overflow: hidden; }
  .lang-btn { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; padding: 6px 10px; background: transparent; color: rgba(253,250,247,0.45); cursor: pointer; border: none; transition: all .2s; letter-spacing: .04em; }
  .lang-btn.active { background: rgba(253,250,247,0.15); color: #fff; }

  /* CONTENT */
  .content { padding: 20px 16px 0; max-width: 560px; margin: 0 auto; }

  /* DAY CARD */
  .day-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; border: 1px solid rgba(42,34,24,0.06); }
  .day-card.hidden { display: none; }
  .day-header { padding: 16px 18px 14px; border-bottom: 1px solid rgba(42,34,24,0.07); background: var(--white); }
  .day-meta { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .day-num { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; margin-top: 2px; }
  .day-titles { flex: 1; }
  .day-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 500; color: var(--ink); line-height: 1.3; margin-bottom: 2px; }
  .day-date { font-size: 12px; color: var(--ink-light); font-weight: 400; }
  .vibes { display: flex; flex-wrap: wrap; gap: 6px; }
  .vibe { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 10px; }

  /* BLOCKS */
  .blocks { padding: 4px 0; }
  .block { padding: 14px 18px; border-bottom: 1px solid rgba(42,34,24,0.06); display: flex; gap: 12px; align-items: flex-start; }
  .block:last-child { border-bottom: none; }
  .time { font-size: 11px; color: var(--ink-light); font-weight: 400; min-width: 72px; padding-top: 2px; flex-shrink: 0; line-height: 1.4; }
  .block-body { flex: 1; min-width: 0; }
  .block-title { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 4px; line-height: 1.4; }
  .block-desc { font-size: 13px; color: var(--ink-mid); line-height: 1.65; font-weight: 300; }
  .who-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .who { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 8px; }
  .who-mom { background: #fce8d0; color: #874a12; }
  .who-dad { background: #deedf8; color: #1a4e72; }
  .who-roxi { background: #e4f5e4; color: #1e6b2e; }
  .who-seb { background: #ede8f8; color: #4a2e87; }
  .who-les { background: #fce8ef; color: #8b1a3a; }
  .who-vlad { background: #f5eed8; color: #7a5a10; }
  .who-all { background: #eeebe6; color: #5a5040; }

  /* INFO BOXES */
  .split-note { font-size: 12px; color: var(--ink-mid); padding: 9px 12px; border-radius: 10px; background: var(--stone); margin-top: 8px; line-height: 1.7; font-weight: 300; }
  .split-note strong { font-weight: 500; color: var(--ink); }
  .walk-box { font-size: 12px; color: #1a4e72; padding: 9px 12px; border-radius: 10px; background: #e8f0fb; margin-top: 8px; line-height: 1.7; border-left: 3px solid #4a80c8; font-weight: 300; }
  .highlight-box { font-size: 12px; color: #1e4a2e; padding: 9px 12px; border-radius: 10px; background: #e8f5ee; margin-top: 8px; line-height: 1.7; border-left: 3px solid #4a9a6a; font-weight: 300; }
  .esoteric-box { font-size: 12px; color: #4a2e87; padding: 9px 12px; border-radius: 10px; background: #f2eefa; margin-top: 8px; line-height: 1.8; border-left: 3px solid #a080d0; font-weight: 300; }
  .esoteric-box strong { font-weight: 500; color: #3a1e77; }
  .resto-box { font-size: 12px; color: #1e4a2e; padding: 9px 12px; border-radius: 10px; background: #e8f5ee; margin-top: 8px; line-height: 1.8; border-left: 3px solid #4a9a6a; font-weight: 300; }
  .resto-box strong { font-weight: 500; color: #1e4a2e; }
  .block-divider { height: 1px; background: rgba(42,34,24,0.06); margin: 0 18px; }
  .day-footer { padding: 10px 18px; background: var(--stone); font-size: 11.5px; color: var(--ink-light); font-weight: 300; font-style: italic; border-top: 1px solid rgba(42,34,24,0.07); line-height: 1.6; }
  .credit { text-align: center; font-size: 11px; color: var(--ink-light); padding: 24px 16px 8px; font-weight: 300; }

  /* VIBE COLORS */
  .v-pool { background: #e0f5f5; color: #0e5c5c; }
  .v-food { background: #fdf0e0; color: #7a4a10; }
  .v-art  { background: #ece0f8; color: #5a1e78; }
  .v-wine { background: #f8e0e8; color: #78103a; }
  .v-hidden { background: #fff8dc; color: #806800; }
  .v-mystic { background: #ede8f8; color: #4a2e87; }
  .v-castle { background: #fff8dc; color: #806800; }
  .v-walk { background: #e0ecf8; color: #1a3e6a; }
  .n-d1 { background: #fde8e0; color: #8b3510; }
  .n-d2 { background: #e0f0ff; color: #1a4e82; }
  .n-d3 { background: #e4f8e0; color: #1e6b1a; }
  .n-d4 { background: #f8f0e0; color: #7a5a10; }
  .n-d5 { background: #f2e0f8; color: #5a1e78; }

  @media (max-width: 360px) {
    .hero h1 { font-size: 26px; }
    .block { padding: 12px 14px; }
    .day-header { padding: 14px 14px 12px; }
    .time { min-width: 62px; }
    .lang-btn { padding: 6px 8px; font-size: 10px; }
  }
</style>
</head>

<div class="hero">

function renderUI(lang) {
  var t = ui[lang];
  document.getElementById('hero-label').textContent = t.label;
  document.getElementById('hero-h1').innerHTML = t.h1;
  document.getElementById('hero-sub').innerHTML = t.sub;
  document.getElementById('badge1').textContent = t.badge1;
  document.getElementById('badge2').textContent = t.badge2;
  document.getElementById('badge3').textContent = t.badge3;
  document.getElementById('tab-all').textContent = t.tabAll;
  var dayIds = ['d1','d2','d3','d4','d5'];
  dayIds.forEach(function(id, i) {
    document.getElementById('tab-'+id).textContent = t.tabs[i];
  });
  document.getElementById('credit').textContent = t.credit;
}

function buildBox(box) {
  if (!box) return '';
  var cls = box.type === 'walk' ? 'walk-box' : box.type === 'esoteric' ? 'esoteric-box' : box.type === 'resto' ? 'resto-box' : 'split-note';
  return '<div class="'+cls+'">'+box.html+'</div>';
}

function renderDays(lang) {
  var data = days[lang];
  var html = '';
  data.forEach(function(day) {
    var hidden = (currentDay !== 'all' && currentDay !== day.id) ? ' hidden' : '';
    html += '<div class="day-card'+hidden+'" data-day="'+day.id+'">';
    html += '<div class="day-header">';
    html += '<div class="day-meta"><span class="day-num '+day.numClass+'">'+day.num+'</span>';
    html += '<div class="day-titles"><div class="day-title">'+day.title+'</div><div class="day-date">'+day.date+'</div></div></div>';
    html += '<div class="vibes">';
    day.vibes.forEach(function(v){ html += '<span class="vibe '+v.cls+'">'+v.label+'</span>'; });
    html += '</div></div>';
    html += '<div class="blocks">';
    day.blocks.forEach(function(b, bi) {
      if (bi > 0) html += '<div class="block-divider"></div>';
      html += '<div class="block"><div class="time">'+b.time+'</div><div class="block-body">';
      html += '<div class="block-title">'+b.title+'</div>';
      html += '<div class="block-desc">'+b.desc+'</div>';
      html += '<div class="who-row">';
      b.who.forEach(function(w){ html += '<span class="who '+w.cls+'">'+w.label+'</span>'; });
      html += '</div>';
      if (b.box) html += buildBox(b.box);
      if (b.box2) html += buildBox(b.box2);
      html += '</div></div>';
    });
    html += '</div>';
    if (day.footer) html += '<div class="day-footer">'+day.footer+'</div>';
    html += '</div>';
  });
  document.getElementById('main-content').innerHTML = html;
}

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-ro').classList.toggle('active', lang === 'ro');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  renderUI(lang);
  renderDays(lang);
}

function showDay(day, btn) {
  currentDay = day;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('.day-card').forEach(function(c){
    if (day === 'all' || c.dataset.day === day) c.classList.remove('hidden');
    else c.classList.add('hidden');
  });
  if (day !== 'all') window.scrollTo({top: 0, behavior: 'smooth'});
}

// Init
renderUI('ro');
renderDays('ro');
